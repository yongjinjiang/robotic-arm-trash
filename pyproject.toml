[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotic-arm-trash"
version = "0.1.0"
description = "Small Gymnasium/MuJoCo experiments for a Reacher-style robotic arm task"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium[mujoco,other]>=1.2.3",
    "matplotlib>=3.8",
    "moviepy>=2.2.1",
    "pytest>=8.4.2",
    "shimmy>=0.2.1",
    "stable-baselines3>=2.0.0",
]

[project.scripts]
robotic-arm-trash = "robotic_arm_trash.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: marks tests that train a model (deselect with '-m \"not slow\"').",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["robotic_arm_trash*"]
exclude = ["demos*", "videos*"]
